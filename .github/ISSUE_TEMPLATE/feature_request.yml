name: Idea or feature request
description: Suggest a new tool or an improvement
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the mod to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you build with it?
      description: The problem it solves or the build it would make easier.
  - type: textarea
    id: media
    attributes:
      label: Pictures or examples
      description: Optional sketches, screenshots or links.
