name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches MOD_VERSION
        run: |
          v=$(sed -n 's/^#define MOD_VERSION "\(.*\)"/\1/p' src/main.cpp)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MOD_VERSION $v in src/main.cpp"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mingw-w64-x86-64-dev zip
      - name: Build, test and package
        run: ./build.sh package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/EnshroudedBuildingTools-$VERSION.zip"
          sha256sum "$zip" | tee "$zip.sha256"
          cat > notes.md <<NOTES
          Enshrouded Building Tools $VERSION (single player, Enshrouded 1.0).

          **Install:** extract the zip into the game folder (next to \`enshrouded.exe\`).
          **Uninstall:** delete \`dinput8.dll\`.

          Keys and options: see \`BuildingTools-README.txt\` in the zip.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            --title "Building Tools $VERSION" --notes-file notes.md
