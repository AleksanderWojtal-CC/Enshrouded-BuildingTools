name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mingw-w64-x86-64-dev zip
      - name: Build, test and package
        run: ./build.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: EnshroudedBuildingTools
          path: dist/*.zip
          if-no-files-found: error
